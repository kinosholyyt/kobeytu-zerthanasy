<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Көбейту әлемі 3D</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js">
<style>
:root{--bg:#2c2068;--ink:#2a1f5c;--y:#ffd96a;--la:#7ef0c4;--lb:#8fd0ff;--lc:#c9b6ff;--pink:#ff9ad0;
 --clay:inset -5px -6px 10px #0000002e,inset 5px 6px 10px #ffffffb0,0 10px 18px #0e063a66}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);background-image:radial-gradient(circle at 12% 18%,#4b38952e 0 80px,transparent 81px),radial-gradient(circle at 88% 70%,#4b389533 0 120px,transparent 121px);color:var(--ink);font-family:"Nunito","Segoe UI Rounded","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.scr{display:none;min-height:100%;padding:16px 16px 40px;max-width:900px;margin:0 auto}
.scr.on{display:block;animation:fu .3s ease}
@keyframes fu{from{opacity:0;transform:translateY(8px)}}
.cl{box-shadow:var(--clay)}
/* home */
.hero{text-align:center;color:#fff;padding:8px 0}
.hero .lg{display:inline-block;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px) rotate(-3deg)}}
h1{margin:4px 0;font-size:clamp(30px,8vw,46px);font-weight:900;text-shadow:0 4px 0 #22175a;line-height:1.1}
h1 u{text-decoration:none;color:var(--y)}
.sub{color:#d9d0ff;font-weight:800;font-size:15px}
.chip3d{display:inline-block;margin-top:8px;background:var(--y);color:var(--ink);font-weight:900;font-size:13px;padding:4px 10px;border-radius:12px;box-shadow:var(--clay)}
.goals{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.goal{color:var(--ink);text-align:left;background:#f2ecff;border-radius:20px;padding:7px 12px;font-size:13px;font-weight:700;max-width:420px;box-shadow:var(--clay)}
.goal b{background:#c9b8ff;border-radius:10px;padding:1px 6px}
.panel{background:#efe9ff;border-radius:28px;padding:16px;margin:16px 0;box-shadow:var(--clay)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.lbl{font-weight:900}
.seg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.seg button{padding:8px 13px;border-radius:18px;font-weight:900;font-size:14px;background:#fff;box-shadow:var(--clay);display:inline-flex;align-items:center;gap:4px}
.seg button.on{background:var(--y)}
.seg button[data-m="1"].on{background:var(--la)}.seg button[data-m="2"].on{background:var(--lb)}.seg button[data-m="3"].on{background:var(--lc)}
.mhint{font-size:13px;color:#4a4270;text-align:center;margin-top:10px;font-weight:700}
input.nm{border:0;border-radius:18px;padding:10px 14px;font:inherit;font-weight:800;color:var(--ink);width:min(260px,100%);box-shadow:var(--clay)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:6px}
.card{position:relative;text-align:left;border-radius:30px;padding:16px;background:color-mix(in srgb,var(--c) 45%,#fff);box-shadow:var(--clay);transition:transform .15s}
.card:hover{transform:translateY(-4px)}.card:active{transform:scale(.97)}
.card .ic{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;background:#ffffffaa;box-shadow:var(--clay)}
.card h3{margin:10px 0 4px;font-size:20px;font-weight:900}
.card p{margin:0;font-size:13.5px;line-height:1.4;font-weight:600;color:#3d3566}
.card .tag{display:inline-block;margin-top:10px;font-size:12px;font-weight:900;padding:3px 9px;border-radius:12px;background:#ffffffaa}
.card .done{position:absolute;top:14px;right:14px;font-size:13px;font-weight:900;padding:3px 8px;border-radius:12px;background:#fff;display:flex;gap:2px;align-items:center}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.bigb{color:var(--ink);padding:12px 20px;border-radius:22px;font-weight:900;background:var(--y);box-shadow:var(--clay)}
.bigb.alt{background:#fff}
.bigb:active{transform:scale(.96)}
/* play */
#c{position:fixed;inset:0;width:100%;height:100%;display:none;touch-action:none;outline:none}
#c.on{display:block}
#play{position:fixed;inset:0;pointer-events:none;display:none;z-index:2}
#play.on{display:block}
#play .top{position:absolute;top:0;left:0;right:0;margin:0 auto;max-width:760px;padding:10px 12px 0}
.bar{display:flex;align-items:center;gap:10px}
.back{pointer-events:auto;width:46px;height:46px;border-radius:18px;background:#fff;box-shadow:var(--clay);font-size:20px;font-weight:900;flex:none}
.ttl{flex:1;min-width:0;color:#fff;font-weight:900;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;text-shadow:0 2px 0 #1a1048}
.lvb{flex:none;font-weight:900;padding:5px 11px;border-radius:16px;font-size:14px;box-shadow:var(--clay)}
.lvb.up{animation:lvup .9s ease}
@keyframes lvup{30%{transform:scale(1.35) rotate(-8deg)}}
.prog{display:flex;gap:6px;margin:8px 0}
.prog i{flex:1;height:10px;border-radius:10px;background:#ffffff30}
.prog i.ok{background:var(--la)}.prog i.hl{background:var(--y)}.prog i.now{background:#fff;animation:pu 1s infinite}
@keyframes pu{50%{opacity:.4}}
.qc{pointer-events:auto;position:relative;background:#fff;border-radius:24px;padding:12px 52px 12px 16px;font-size:clamp(16px,4.2vw,20px);font-weight:800;line-height:1.4;box-shadow:var(--clay)}
.qc .spk{position:absolute;right:8px;top:8px;width:38px;height:38px;border-radius:16px;background:var(--lb);box-shadow:var(--clay);display:grid;place-items:center}
.qc b.nm{background:var(--y);border-radius:8px;padding:0 5px}
.qc b.nm.glow{background:var(--pink);color:#fff}
#play .bot{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:760px;padding:0 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:8px}
.bot .rb{flex:none;width:52px;height:52px;animation:fl 3s ease-in-out infinite}
.bub{flex:1;min-width:0;background:#fff;border-radius:22px;padding:9px 13px;font-weight:800;font-size:14.5px;line-height:1.35;box-shadow:var(--clay)}
.bub.pop{animation:bp .3s ease}
@keyframes bp{from{transform:scale(.94)}}
.bub .who{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:900;color:#6a4ae6;letter-spacing:.5px;text-transform:uppercase}
#hintBtn{pointer-events:auto;flex:none;height:52px;padding:0 12px;border-radius:20px;font-weight:900;background:var(--y);box-shadow:var(--clay);display:flex;align-items:center;gap:4px}
#race{position:fixed;inset:0;display:none;z-index:3;pointer-events:none}
#race.on{display:block}
.rbar{position:absolute;top:8px;left:10px;right:10px;display:flex;align-items:center;gap:10px}
.rbar .back,.rbar #rend{pointer-events:auto}
#rend{display:none;padding:8px 14px;font-size:14px;border-radius:16px}#rend.on{display:block}
#rcount{position:absolute;left:0;right:0;top:0;height:var(--rvh,40vh);display:none;place-items:center;font-size:clamp(70px,16vw,170px);font-weight:900;color:#fff;text-shadow:0 8px 0 #1a1048}
#rcount.on{display:grid}#rcount.pop{animation:pop .4s}
.rpanels{position:absolute;left:0;right:0;bottom:0;top:var(--rvh,40vh);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:10px;pointer-events:auto;background:var(--bg)}
.rpanels.intro{display:flex;align-items:center;justify-content:center}
.rpanels.wait .tq,.rpanels.wait .to{filter:blur(16px);pointer-events:none}
.rcard{background:#efe9ff;border-radius:26px;padding:16px 20px;max-width:660px;box-shadow:var(--clay);text-align:center;max-height:100%;overflow:auto}
.rcard h2{margin:0 0 6px}.rcard p{font-weight:700;margin:0 0 12px;line-height:1.45}
.tp{position:relative;min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:22px;background:#fff;box-shadow:var(--clay)}
.tp .th{display:flex;align-items:center;gap:8px;padding:7px 12px;font-weight:900;background:color-mix(in srgb,var(--tc) 55%,#fff);font-size:clamp(13px,1.5vw,18px)}
.tp .tb{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#fff;flex:none}
.tp .tn{flex:1;font-weight:800;font-size:.85em;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp .tt{background:#fff;border-radius:12px;padding:2px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tp .tq{flex:1;min-height:0;overflow:hidden;padding:8px 14px;font-weight:800;font-size:clamp(14px,1.9vw,23px);line-height:1.3;display:flex;align-items:center}
.tp .to{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 10px 10px}
.tp .to button{padding:clamp(8px,1.8vh,20px) 4px;font-size:clamp(20px,3vw,36px);font-weight:900;border-radius:18px;background:color-mix(in srgb,var(--tc) 42%,#fff);box-shadow:var(--clay);touch-action:manipulation;user-select:none}
.tp .to button:active{transform:scale(.95)}
.tp .pz{position:absolute;inset:0;background:#2a1f5cd9;color:#fff;display:none;place-items:center;font-weight:900;font-size:clamp(20px,3vw,38px);text-align:center;line-height:1.25}
.tp.paused .pz{display:grid}
.tp.paused{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tp .fin{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;font-size:clamp(20px,2.6vw,34px);text-align:center}
.tp .fin span{font-size:.6em;font-weight:800;opacity:.75}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 14px;margin:8px 0;border-radius:16px;background:#fff;border-left:12px solid var(--tc);font-weight:800;color:var(--ink)}
.rrow .pl{font-size:24px;width:26px}.rrow .nm2{flex:1;text-align:left}.rrow .wr{color:#6a6090;font-size:13px}
@media (orientation:portrait){.rpanels{grid-template-columns:1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:6px;padding:6px}.tp .to{grid-template-columns:repeat(4,1fr);gap:6px;padding:0 8px 8px}.tp .tq{font-size:14px;padding:4px 12px}.tp .to button{font-size:21px;padding:9px 2px;border-radius:14px}.tp .th{padding:4px 10px}.rcard p{font-size:14px}}
#loading{position:fixed;inset:0;display:none;place-items:center;color:#fff;font-weight:900;font-size:18px;z-index:5;background:var(--bg)}
#loading.on{display:grid}
.spin{width:54px;height:54px;border-radius:50%;border:6px solid #ffffff33;border-top-color:var(--y);animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(1turn)}}
.lvflash{position:fixed;inset:0;pointer-events:none;z-index:9;display:grid;place-items:center;font-size:clamp(70px,20vw,140px);font-weight:900;animation:lvf 1.2s ease forwards;text-shadow:0 8px 0 #1a1048}
@keyframes lvf{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.1)}70%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
/* end/report */
.endc{text-align:center;color:#fff;padding-top:12px}
.stars3{display:flex;justify-content:center;gap:8px;margin:10px 0}
.stars3 span{animation:pop .5s both}
.stars3 span:nth-child(2){transform:translateY(-10px)}
.stars3 .off{filter:grayscale(1) brightness(.6);opacity:.6}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
.endc .panel{color:var(--ink)}
.path{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:120px;margin:12px auto;padding:12px;border-radius:20px;background:#2e2066;width:min(100%,420px)}
.path i{width:24px;border-radius:8px;box-shadow:inset -3px -3px 5px #0003,inset 3px 3px 5px #fff8;position:relative;animation:gr .5s both}
.path i.x:after{content:"✗";position:absolute;top:-22px;left:50%;transform:translateX(-50%);color:var(--pink);font-style:normal;font-weight:900}
@keyframes gr{from{height:0!important}}
.legend{font-size:13px;color:#5a5080;font-weight:700}
table.rep{width:100%;border-collapse:collapse;font-size:14px}
.rep td,.rep th{padding:9px 6px;border-bottom:2px dashed #2a1f5c22;text-align:left}
.rep th{font-size:12px;color:#6a6090}
.rep td .sv{vertical-align:-6px}
.badge{display:inline-block;min-width:28px;text-align:center;padding:2px 8px;border-radius:10px;font-weight:900}
.grp{border-radius:18px;padding:10px 12px;margin-top:10px;background:#fff;border-left:10px solid var(--c);font-weight:600}
.rtop{display:flex;align-items:center;gap:10px;color:#fff;font-weight:900;font-size:19px}
#modal{position:fixed;inset:0;background:#120a38cc;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.on{display:flex}
.mbox{background:#f2ecff;border-radius:26px;padding:18px;max-width:620px;max-height:88vh;overflow:auto;box-shadow:var(--clay)}
.mbox h2{margin:0 0 8px}.mbox h4{margin:14px 0 4px;display:inline-block;background:var(--y);padding:1px 8px;border-radius:10px}
.mbox li{margin:6px 0;line-height:1.4;font-weight:600}
.sv{display:inline-block;vertical-align:middle;overflow:visible;flex:none}
@media (max-width:520px){.bub{font-size:13.5px}.bot .rb{width:44px;height:44px}#hintBtn{padding:0 9px;font-size:14px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<section id="home" class="scr on">
 <div class="hero"><div class="lg" id="hlogo"></div>
  <h1>Көбейту <u>әлемі</u></h1>
  <div class="sub">2-сынып · 2-ге көбейту кестесі · <span class="rbi"></span> AI-саралау</div>
  <span class="chip3d">3D ойындар</span>
  <div class="goals">
   <div class="goal"><b>2.1.2.4</b> — 2-ге көбейту кестесін құру, білу және қолдану</div>
   <div class="goal"><b>2.1.1.5</b> — 50-ге дейін 3, 4, 5-тен тура және кері санау, жұп/тақ, 6–9 тең бөлікке бөлу</div>
  </div>
 </div>
 <div class="panel">
  <div class="row" style="margin-bottom:10px"><span class="lbl">Оқушы:</span><input class="nm" id="nm" placeholder="Аты (міндетті емес)" maxlength="24"></div>
  <div class="row"><span class="lbl">Деңгей:</span>
   <div class="seg" id="seg"><button data-m="ai" class="on"><span class="rbi"></span> AI автомат</button><button data-m="1">A · базалық</button><button data-m="2">B · орта</button><button data-m="3">C · жоғары</button></div></div>
  <div class="mhint" id="mhint"></div>
 </div>
 <div class="grid" id="grid"></div>
 <div class="btns"><button class="bigb" id="toRep">Саралау есебі</button><button class="bigb alt" id="toInfo">Мұғалімге</button></div>
</section>

<canvas id="c"></canvas>
<section id="play">
 <div class="top">
  <div class="bar"><button class="back" id="back" aria-label="Артқа">⬅</button><div class="ttl" id="ttl"></div><div class="lvb" id="lvb"></div></div>
  <div class="prog" id="prog"></div>
  <div class="qc" id="q"></div>
 </div>
 <div class="bot"><span class="rb" id="rbot"></span><div class="bub" id="bub"></div><button id="hintBtn"></button></div>
</section>
<section id="race"><div class="rbar"><button class="back" id="rback" aria-label="Артқа">⬅</button><div class="ttl" id="rttl"></div><button class="bigb alt" id="rend">Жарысты аяқтау</button></div><div id="rcount"></div><div class="rpanels" id="rpanels"></div></section>
<div id="loading"><div><div class="spin"></div>3D әлем жүктелуде…</div></div>
<section id="end" class="scr"><div class="endc" id="endc"></div></section>
<section id="report" class="scr"><div id="repc"></div></section>
<div id="modal"><div class="mbox" id="mbox"></div></div>

 $('#endc').innerHTML=`<div class="lg">${ico('trophy',96)}</div><h1>${g.title}</h1><div class="sub">Деңгей: ${LV[rc.lv].k} · ${LV[rc.lv].name}</div><div class="panel">${rows.map((tm,i)=>`<div class="rrow" style="--tc:${tm.t.c}"><b class="pl">${i+1}</b><span class="nm2">${tm.t.n}</span><b>${tm.done?fmt(tm.time)+' с':tm.idx+'/8 есеп'}</b><span class="wr">қате: ${tm.wrong}</span></div>`).join('')}</div><div class="btns"><button class="bigb" id="again">Қайта жарыс</button><button class="bigb alt" id="home2">Басқа ойын</button></div>`;
 raceStop();show('end');sfx('up');$('#again').onclick=()=>startRace(g);$('#home2').onclick=goHome}
function raceStop(){if(RC){clearInterval(RC.timer);RC=null}$('#rend').classList.remove('on');$('#rcount').className='';$('#c').style.height=''}

/* ================= ОЙЫН ЛОГИКАСЫ ================= */
const S={mode:'ai',name:'',res:{}};
try{const d=JSON.parse(localStorage.getItem('nu_kob3d')||'{}');if(d.res)S.res=d.res;if(d.name)S.name=d.name;if(d.mode)S.mode=d.mode}catch(e){}
const save=()=>{try{localStorage.setItem('nu_kob3d',JSON.stringify(S))}catch(e){}};
let cur=null;
const MHINT={ai:'AI оқушыны бақылайды: қатарынан 2 дұрыс — деңгей көтеріледі, 2 қате — түсіп, көмектеседі.','1':'A — көрнекі: қораптар, жапырақтар, кристалдар. Әлсіз оқушыға немесе жаңа тақырыпқа.','2':'B — сандармен есептеу, тура және кері санау. Орта топқа.','3':'C — кері есеп, логика, екі қадамды есептер. Күшті оқушыға.'};
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));$('#play').classList.toggle('on',id==='play');$('#race').classList.toggle('on',id==='race');if(id!=='play'&&id!=='race')stop3d();scrollTo(0,0)}
function say(t){const b=$('#bub');b.innerHTML='<span class="who">'+ico('robot',14)+' Ақыл · AI-көмекші</span>'+emo(t);b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}
function q(html){const c=$('#q');c.innerHTML=emo(html);const b=el('button','spk',ico('spk',22));b.onclick=()=>speak(html);c.append(b)}
function setBar(){const L=LV[cur.lv];const lb=$('#lvb');lb.style.background=L.c;lb.innerHTML=`${L.k} <small>${L.name}</small>`;
 $('#prog').innerHTML=Array.from({length:TOTAL},(_,i)=>{const p=cur.path[i];return`<i class="${p?(p.ok?'ok':'hl'):i===cur.n?'now':''}"></i>`}).join('')}
function lvFx(){const L=LV[cur.lv];const f=el('div','lvflash',L.k);f.style.color=L.c;document.body.append(f);setTimeout(()=>f.remove(),1250);sfx('up');const lb=$('#lvb');lb.classList.remove('up');void lb.offsetWidth;lb.classList.add('up')}
async function startGame(id){const g=GAMES.find(x=>x.id===id);if(g.race)return startRace(g);raceStop();try{await init3d()}catch(e){$('#loading').classList.remove('on');alert('3D жүктелмеді. Интернетті тексеріңіз.');return}
 const prev=S.res[id];cur={g,lv:S.mode==='ai'?(prev?Math.max(1,prev.lv):1):+S.mode,n:0,ok:0,streak:0,bad:0,path:[]};
 $('#ttl').innerHTML=ico(g.icon,30)+' '+g.title;show('play');clearWorld();g.build();resize3d();const c=camOf(g);if(g.follow){cam.fov=c.fov;cam.updateProjectionMatrix();cam.position.copy(rig.pos);rig.cur.copy(rig.look)}else setCam(c,true);start3d();
 say(S.mode==='ai'?`Сәлем${S.name?', '+S.name:''}! Мен — Ақыл. Деңгейді өзім таңдаймын: қазір <b>${LV[cur.lv].k}</b>. Қиналсаң — «Көмек» бас!`:`Деңгей: <b>${LV[cur.lv].k} · ${LV[cur.lv].name}</b>. Қиналсаң — «Көмек» бас.`);next()}
function next(){if(!cur)return;if(cur.n>=TOTAL)return finish();$('#q').style.visibility='';cur.first=true;cur.hint=0;cur.locked=false;clearTask();cur.task=cur.g.make(cur.lv);setBar();$('#hintBtn').innerHTML=ico('bulb',24)+' Көмек';cur.g.show(cur.task)}
function right(src,delay){if(!cur)return;cur.locked=true;sfx('good');const first=cur.first;cur.path.push({lv:cur.lv,ok:first});cur.n++;
 let msg=pick(PRAISE);if(first){cur.ok++;cur.streak++;cur.bad=0}else{cur.streak=0;msg='Дұрыс! Көмекпен таптың — келесіде өзің табасың.'}
 if(S.mode==='ai'&&first&&cur.streak>=2&&cur.lv<3&&cur.n<TOTAL){cur.lv++;cur.streak=0;msg=`Қатарынан дұрыс! Деңгей көтерілді: <b>${LV[cur.lv].k} · ${LV[cur.lv].name}</b>`;setTimeout(lvFx,300)}
 say(msg);setBar();const c=cur;setTimeout(()=>{if(cur===c)next()},delay||1200)}
function wrong(msg){if(!cur)return;sfx('bad');try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}let pre='';
 if(cur.first){cur.first=false;cur.bad++;cur.streak=0;if(S.mode==='ai'&&cur.bad>=2&&cur.lv>1){cur.lv--;cur.bad=0;pre=`Ештеңе етпейді! Келесі тапсырма жеңілірек болады (деңгей <b>${LV[cur.lv].k}</b>). `}}say(pre+msg)}
function hint(){if(!cur||cur.locked)return;cur.hint=Math.min(cur.hint+1,3);if(cur.first){cur.first=false;cur.streak=0}say('💡 '+cur.g.hint(cur.task,cur.hint));$('#hintBtn').innerHTML=ico('bulb',24)+(cur.hint<3?` ${cur.hint+1}/3`:' 3/3')}
async function finish(){const c=cur;c.locked=true;clearTask();$('#q').style.visibility='hidden';say('Барлық тапсырма орындалды! Керемет!');if(c.g.finale)await c.g.finale();await wait(.4);if(cur!==c)return;
 const {g,ok,path,lv}=c;const st=ok>=7?3:ok>=5?2:1;S.res[g.id]={lv,ok,tot:TOTAL,path,st,at:Date.now()};save();const L=LV[lv];
 const cm={1:'Көрнекі заттармен жақсы жұмыс істейді. Келесі қадам — сандармен есептеу (B).',2:'Сандармен сенімді есептейді. Келесі қадам — кері есеп пен логика (C).',3:'Жоғары деңгей! Логикалық, кері есептерді шешеді. Енді өзі есеп құрастырып, досына берсін.'}[lv];
 $('#endc').innerHTML=`<div class="lg">${ico(g.icon,96)}</div><h1>${g.title}</h1><div class="stars3">${[1,2,3].map(i=>`<span class="${i<=st?'':'off'}" style="animation-delay:${i*.15}s">${ico('star',58)}</span>`).join('')}</div>
  <div class="sub">Бірден дұрыс: <b style="color:#fff">${ok} / ${TOTAL}</b> · Соңғы деңгей: <span class="badge" style="background:${L.c}">${L.k}</span></div>
  <div class="panel" style="text-align:center"><div class="lbl">AI-саралау жолы</div><div class="path">${path.map((p,i)=>`<i class="${p.ok?'':'x'}" style="height:${p.lv*30}px;background:${LV[p.lv].c};animation-delay:${i*.07}s"></i>`).join('')}</div>
  <div class="legend">Баған биіктігі — деңгей (A, B, C) · ✗ — қате немесе көмекпен</div><p style="font-weight:700;margin:10px 0 0">${cm}</p></div>
  <div class="btns"><button class="bigb" id="again">Қайта ойнау</button><button class="bigb alt" id="home2">Басқа ойын</button></div>`;
 cur=null;show('end');sfx('up');$('#again').onclick=()=>startGame(g.id);$('#home2').onclick=goHome}
function goHome(){raceStop();cur=null;TW.length=0;try{speechSynthesis.cancel()}catch(e){}renderHome();show('home')}
function renderHome(){$('#nm').value=S.name;document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===String(S.mode)));$('#mhint').textContent=MHINT[S.mode];
 const gr=$('#grid');gr.innerHTML='';GAMES.forEach(g=>{const r=S.res[g.id];const c=el('button','card',`<span class="ic">${ico(g.icon,62)}</span><h3>${g.title}</h3><p>${g.desc}</p><span class="tag">${g.tag}</span>${r?`<span class="done">${ico('star',14).repeat(r.st)} ${LV[r.lv].k}</span>`:''}`);c.style.setProperty('--c',g.c);c.onclick=()=>{sfx('tap');startGame(g.id)};gr.append(c)})}
$('#seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.mode=b.dataset.m==='ai'?'ai':+b.dataset.m;save();renderHome();sfx('tap')};
$('#nm').oninput=e=>{S.name=e.target.value.trim();save()};
$('#back').onclick=goHome;$('#rback').onclick=goHome;$('#rend').onclick=()=>raceResults();$('#hintBtn').onclick=hint;
$('#toRep').onclick=()=>{const played=GAMES.filter(g=>S.res[g.id]);let h=`<div class="rtop"><button class="back" id="rb">⬅</button>Саралау есебі${S.name?' · '+S.name:''}</div>`;
 if(!played.length)h+=`<div class="panel" style="text-align:center">Әлі ойын ойналған жоқ. Кез келген ойынды бастаңыз — AI деңгейді өзі анықтайды.</div>`;
 else{const avg=played.reduce((s,g)=>s+S.res[g.id].lv,0)/played.length,grp=avg<1.67?1:avg<2.34?2:3;
  h+=`<div class="panel"><table class="rep"><tr><th>Ойын</th><th>Дұрыс</th><th>Деңгей</th><th>Жол</th></tr>${played.map(g=>{const r=S.res[g.id];return`<tr><td>${ico(g.icon,24)} ${g.title}</td><td><b>${r.ok}/${r.tot}</b></td><td><span class="badge" style="background:${LV[r.lv].c}">${LV[r.lv].k}</span></td><td>${r.path.map(p=>`<span style="color:${LV[p.lv].c}">${p.ok?'●':'○'}</span>`).join('')}</td></tr>`}).join('')}</table>
  <div class="grp" style="--c:${LV[grp].c}">AI қорытындысы: оқушы — <b>${LV[grp].k} тобы (${LV[grp].name})</b>.<br>${{1:'Ұсыныс: заттармен жұмыс; 2-ні қайталап қосу → көбейту. Келесі сабақта «Көпір» A мен «Ракета жүгі» A.',2:'Ұсыныс: кері санауды және кері есепті бекіту. Келесі сабақта «Бақа» C мен «Көпір» C.',3:'Ұсыныс: логикалық, кері, екі қадамды есептер; өзі есеп құрастырсын, досына көмекші болсын.'}[grp]}</div></div>`}
 h+=`<div class="panel"><div class="lbl">Топтар туралы</div>${[1,2,3].map(l=>`<div class="grp" style="--c:${LV[l].c}"><b>${LV[l].k} · ${LV[l].name}</b> — ${MHINT[l].slice(4)}</div>`).join('')}</div><div class="btns"><button class="bigb alt" id="clr">Нәтижені тазалау (келесі оқушы)</button></div>`;
 $('#repc').innerHTML=h;show('report');$('#rb').onclick=goHome;$('#clr').onclick=()=>{S.res={};S.name='';save();goHome()}};
$('#toInfo').onclick=()=>{$('#mbox').innerHTML=`<h2>Ойын арқылы саралау</h2>
 <h4>Үш деңгей (әр ойында)</h4><ul><li><b>A · базалық</b> — көрнекі: қораптағы жемістер, 5-тен санау, 6 ракета; бір қадам.</li><li><b>B · орта</b> — тек сандармен: 2·n, 3/4/5-тен тура санау, 6–9 ракета.</li><li><b>C · жоғары</b> — кері есеп (2·? = 14), 50-ден кері санау, көп кристалды тең бөлу.</li></ul>
 <h4>AI автомат режимі</h4><ul><li>Әр оқушы A-дан бастайды. Қатарынан 2 рет бірден дұрыс → деңгей көтеріледі.</li><li>Қатарынан 2 тапсырмада қате → деңгей түседі, AI жеңілірек тапсырма береді.</li><li>«Көмек» — 3 қадам. Көмекпен табылған жауап «бірден дұрыс» болып саналмайды.</li><li>Соңында «Саралау есебі» оқушыны A, B, C тобына бөліп, келесі сабаққа ұсыныс береді.</li></ul>
 <h4>Сабақта қолдану реті</h4><ul><li>1. Ой қозғау — Бақа секірісі (3, 4, 5-тен тура және кері санау).</li><li>2. Жаңа тақырып — Көпір құрылысы (2-ге көбейту кестесі).</li><li>3. Бекіту — Ракета жүгі (6, 7, 8, 9 тең бөлікке бөлу).</li><li>4. Мәтіндік және логикалық есеп — Есеп жарысы, Логика жарысы: сынып 3 топқа бөлініп, тақтада жарысады.</li></ul>
 <h4>Тақтада</h4><ul><li>Бүкіл сыныппен ойнағанда деңгейді қолмен таңдаңыз (A/B/C).</li><li>Бір құрылғыда бірнеше оқушы: есеп бетінде «тазалау» басып, келесі оқушының атын жазыңыз.</li></ul>
 <div class="btns"><button class="bigb" id="mclose">Түсінікті</button></div>`;$('#modal').classList.add('on');$('#mclose').onclick=()=>$('#modal').classList.remove('on')};
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')};
$('#hlogo').innerHTML=ico('flask',84);document.querySelectorAll('.rbi').forEach(e=>e.innerHTML=ico('robot',20));$('#rbot').innerHTML=ico('robot',52);
renderHome();
window.__dbg={GAMES,get cur(){return cur},get HUD(){return HUD},get RC(){return RC},startGame,next,right,hint};
const Q=new URLSearchParams(location.search);if(Q.get('demo')){if(Q.get('lv'))S.mode=+Q.get('lv');startGame(Q.get('demo'))}
</script>
</body>
